<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>粒子视界 | Gesture Particle System</title>
    <script async src="https://ga.jspm.io/npm:es-module-shims@1.10.0/dist/es-module-shims.js"></script>
    <style>
        :root {
            --primary-color: #ff0055;
            --bg-color: #050505;
            --glass-bg: rgba(20, 20, 20, 0.6);
            --border: 1px solid rgba(255, 255, 255, 0.1);
        }
        body {
            margin: 0;
            overflow: hidden;
            background-color: var(--bg-color);
            font-family: 'Inter', 'Segoe UI', sans-serif;
            user-select: none;
        }
        #canvas-container {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            z-index: 1;
        }
        #loader {
            position: fixed;
            top: 0; left: 0; right: 0; bottom: 0;
            background: #000;
            z-index: 100;
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            color: var(--primary-color);
            transition: opacity 0.5s;
            padding:20px;
            box-sizing:border-box;
            text-align:center;
        }
        .loader-ring {
            width: 60px; height: 60px;
            border: 4px solid rgba(255, 0, 85, 0.1);
            border-top: 4px solid var(--primary-color);
            border-radius: 50%;
            animation: spin 1s linear infinite;
            margin-bottom: 20px;
        }
        @keyframes spin { 0% { transform: rotate(0deg); } 100% { transform: rotate(360deg); } }
        .ui-layer {
            position: absolute;
            z-index: 10;
            pointer-events: none;
            width: 100%;
            height: 100%;
        }
        .camera-hud {
            position: absolute;
            bottom: 16px;
            left: 16px;
            width: 140px;
            height: 105px;
            background: #000;
            border-radius: 12px;
            overflow: hidden;
            border: var(--border);
            box-shadow: 0 10px 30px rgba(0,0,0,0.5);
            pointer-events: auto;
        }
        #input-video {
            width: 100%;
            height: 100%;
            object-fit: cover;
            transform: scaleX(-1);
            opacity: 0.7;
        }
        .hud-status {
            position: absolute;
            bottom: 4px;
            left:4px;
            font-size: 10px;
            color: #fff;
            background: rgba(0,0,0,0.6);
            padding: 2px 6px;
            border-radius: 4px;
            display: flex;
            align-items: center;
            gap: 4px;
        }
        .status-dot {
            width: 6px; height: 6px;
            background: #ff3333;
            border-radius: 50%;
            box-shadow: 0 0 4px #ff3333;
            transition: background 0.3s;
        }
        .status-dot.active { background: #00ff88; box-shadow: 0 0 4px #00ff88; }
        .header-info {
            position: absolute;
            top: 20px;
            left: 50%;
            transform: translateX(-50%);
            text-align: center;
            color: white;
            pointer-events: none;
            width:90%;
        }
        h1 { margin: 0; font-size: 1.2rem; letter-spacing: 2px; font-weight: 300; opacity: 0.9; }
        p.subtitle { margin: 6px 0 0; font-size: 0.8rem; color: rgba(255,255,255,0.5); }
        .fs-btn {
            position: absolute;
            bottom: 16px;
            right: 16px;
            pointer-events: auto;
            background: var(--glass-bg);
            border: var(--border);
            color: white;
            padding: 10px 16px;
            border-radius: 30px;
            cursor: pointer;
            backdrop-filter: blur(10px);
            transition: all 0.3s;
            font-size:12px;
            letter-spacing: 1px;
        }
        .fs-btn:hover { background: rgba(255,255,255,0.2); }
    </style>

    <script type="importmap">
        {
            "imports": {
                "three": "https://unpkg.com/three@0.160.0/build/three.module.js",
                "three/addons/": "https://unpkg.com/three@0.160.0/examples/jsm/"
            }
        }
    </script>
</head>
<body>
    <div id="loader">
        <div class="loader-ring"></div>
        <div>初始化视觉引擎...</div>
        <div id="loader-tip" style="font-size: 12px; margin-top: 10px; color: #666">请授予摄像头权限</div>
    </div>
    <div id="canvas-container"></div>
    <div class="ui-layer">
        <div class="header-info">
            <h1>PARTICLE VISION</h1>
            <p class="subtitle" id="gesture-hint">张开手掌扩散粒子 · 握拳凝聚形态</p>
        </div>
        <div class="camera-hud" id="cameraBox">
            <video id="input-video" playsinline muted></video>
            <div class="hud-status">
                <div class="status-dot" id="status-dot"></div>
                <span id="status-text">正在搜寻手势...</span>
            </div>
        </div>
        <button class="fs-btn" onclick="toggleFullScreen()">⛶ 全屏</button>
    </div>

    <script type="module">
        import * as THREE from 'three';
        import { GUI } from 'three/addons/libs/lil-gui.module.min.js';
        import { OrbitControls } from 'three/addons/controls/OrbitControls.js';

        const isMobile = /Android|iPhone|iPad|iPod/i.test(navigator.userAgent);
        const isSecure = window.isSecureContext;
        const defaultParticleCount = isMobile ? 6000 : 15000;

        let Hands, Camera;

        const config = {
            particleCount: defaultParticleCount,
            particleSize: isMobile ? 0.22 : 0.15,
            baseColor: '#ff0055',
            shape: 'heart',
            handSensitivity: 2.5,
            smoothness: 0.1,
            idleAnimation: true
        };
        const state = {
            targetShapePositions: [],
            handInfluence: 0,
            smoothedInfluence: 0,
            time: 0
        };
        let scene, camera, renderer, particles, geometry, material, controls;

        async function loadMediaPipe(){
            await import('https://cdn.jsdelivr.net/npm/@mediapipe/camera_utils/camera_utils.js');
            await import('https://cdn.jsdelivr.net/npm/@mediapipe/hands/hands.js');
            Hands = window.Hands;
            Camera = window.Camera;
        }

        async function init() {
            initScene();
            initParticles();
            initGUI();
            generateShape('heart');
            animate();
            const loaderTip = document.getElementById('loader-tip');
            const cameraBox = document.getElementById('cameraBox');

            if(!isSecure){
                loaderTip.innerText = "⚠️非安全环境，手势禁用，请使用HTTPS地址";
                cameraBox.style.display="none";
                setTimeout(()=>{
                    document.getElementById('loader').style.opacity=0;
                    setTimeout(()=>document.getElementById('loader').style.display='none',500);
                },2000);
                return;
            }

            try{
                await loadMediaPipe();
                await initComputerVision();
                document.getElementById('loader').style.opacity = 0;
                setTimeout(() => document.getElementById('loader').style.display = 'none', 500);
            }catch(e){
                console.error(e);
                loaderTip.innerText="摄像头启动失败:"+e.message;
                setTimeout(()=>{
                    document.getElementById('loader').style.opacity=0;
                    setTimeout(()=>document.getElementById('loader').style.display='none',500);
                },2500);
            }
        }

        function initScene() {
            const container = document.getElementById('canvas-container');
            scene = new THREE.Scene();
            scene.fog = new THREE.FogExp2(0x050505, 0.02);
            camera = new THREE.PerspectiveCamera(75, window.innerWidth / window.innerHeight, 0.1, 1000);
            camera.position.z = 25;
            renderer = new THREE.WebGLRenderer({ antialias: !isMobile, alpha: true });
            renderer.setPixelRatio(isMobile ? 1 : Math.min(window.devicePixelRatio, 2));
            renderer.setSize(window.innerWidth, window.innerHeight);
            container.appendChild(renderer.domElement);
            controls = new OrbitControls(camera, renderer.domElement);
            controls.enableDamping = true;
            controls.autoRotate = true;
            controls.autoRotateSpeed = 0.5;
            controls.enableZoom = false;
            window.addEventListener('resize', onWindowResize);
        }

        function initParticles() {
            geometry = new THREE.BufferGeometry();
            const positions = new Float32Array(config.particleCount * 3);
            const colors = new Float32Array(config.particleCount * 3);
            const originalPositions = new Float32Array(config.particleCount * 3);
            const randomPositions = new Float32Array(config.particleCount * 3);
            for(let i=0;i<config.particleCount;i++){
                const i3 = i*3;
                randomPositions[i3] = (Math.random()-0.5)*20;
                randomPositions[i3+1] = (Math.random()-0.5)*20;
                randomPositions[i3+2] = (Math.random()-0.5)*20;
            }
            geometry.setAttribute('position', new THREE.BufferAttribute(positions, 3));
            geometry.setAttribute('color', new THREE.BufferAttribute(colors, 3));
            material = new THREE.PointsMaterial({
                size: config.particleSize,
                vertexColors: true,
                transparent:true,
                opacity:0.8,
                depthWrite:false
            });
            particles = new THREE.Points(geometry, material);
            scene.add(particles);
            state.randomPositions = randomPositions;
            state.originalPositions = originalPositions;
        }

        function generateShape(type){
            const arr = [];
            const count = config.particleCount;
            if(type==='heart'){
                for(let i=0;i<count;i++){
                    const t = Math.random()*Math.PI*2;
                    const s = Math.random();
                    const x = 16 * Math.pow(Math.sin(t),3) * s;
                    const y = (13*Math.cos(t)-5*Math.cos(2*t)-2*Math.cos(3*t)-Math.cos(4*t))*s;
                    const z = (Math.random()-0.5)*2;
                    arr.push(x,y,z);
                }
            }else{
                for(let i=0;i<count;i++){
                    const r = 6*Math.cbrt(Math.random());
                    const th = Math.random()*Math.PI*2;
                    const phi = Math.acos(2*Math.random()-1);
                    arr.push(r*Math.sin(phi)*Math.cos(th),r*Math.sin(phi)*Math.sin(th),r*Math.cos(phi));
                }
            }
            state.targetShapePositions = new Float32Array(arr);
        }

        async function initComputerVision(){
            const video = document.getElementById('input-video');
            const statusDot = document.getElementById('status-dot');
            const statusText = document.getElementById('status-text');
            const hands = new Hands({
                locateFile: (file)=>`https://cdn.jsdelivr.net/npm/@mediapipe/hands/${file}`
            });
            hands.setOptions({
                maxNumHands:1,
                modelComplexity:1,
                minDetectionConfidence:0.5,
                minTrackingConfidence:0.5
            });
            hands.onResults((res)=>{
                if(res.multiHandLandmarks.length>0){
                    statusDot.classList.add('active');
                    statusText.innerText="识别到手";
                    const lm = res.multiHandLandmarks[0];
                    const thumb = lm[4];
                    const index = lm[8];
                    const dist = Math.hypot(thumb.x-index.x, thumb.y-index.y);
                    state.handInfluence = Math.min(1, dist*3);
                }else{
                    statusDot.classList.remove('active');
                    statusText.innerText="等待手势";
                    state.handInfluence = 0;
                }
            });
            const cam = new Camera(video,{
                onFrame: async ()=>{ await hands.send({image:video}); },
                width:640,height:480
            });
            await cam.start();
        }

        function animate(){
            requestAnimationFrame(animate);
            state.time += 0.016;
            state.smoothedInfluence += (state.handInfluence - state.smoothedInfluence) * config.smoothness;
            const posAttr = geometry.attributes.position;
            const colorAttr = geometry.attributes.color;
            const pos = posAttr.array;
            const color = colorAttr.array;
            const target = state.targetShapePositions;
            const randPos = state.randomPositions;
            const t = state.smoothedInfluence;
            const c = new THREE.Color(config.baseColor);
            for(let i=0;i<config.particleCount;i++){
                const i3 = i*3;
                pos[i3] = THREE.MathUtils.lerp(target[i3], randPos[i3], t);
                pos[i3+1] = THREE.MathUtils.lerp(target[i3+1], randPos[i3+1], t);
                pos[i3+2] = THREE.MathUtils.lerp(target[i3+2], randPos[i3+2], t);
                color[i3] = c.r; color[i3+1] = c.g; color[i3+2] = c.b;
            }
            posAttr.needsUpdate = true;
            colorAttr.needsUpdate = true;
            controls.update();
            renderer.render(scene,camera);
        }

        function onWindowResize(){
            camera.aspect = window.innerWidth / window.innerHeight;
            camera.updateProjectionMatrix();
            renderer.setSize(window.innerWidth, window.innerHeight);
        }
        window.toggleFullScreen = ()=>{
            if(document.fullscreenElement) document.exitFullscreen();
            else document.documentElement.requestFullscreen();
        }
        function initGUI(){
            if(isMobile) return;
            const gui = new GUI();
            gui.add(config, 'shape', {heart:'heart',sphere:'sphere'}).name('形状').onChange(v=>generateShape(v));
            gui.add(config, 'handSensitivity',0.5,5).name('手势灵敏度');
        }
        init();
    </script>
</body>
</html>
